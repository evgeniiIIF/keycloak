services:
  postgres:
    image: postgres:15
    container_name: keycloak_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - keycloak-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: keycloak_server
    command: start-dev
    volumes:
      - ./themes:/opt/keycloak/themes
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - keycloak-network

  redis:
    image: redis:7-alpine
    container_name: redis_session_store
    ports:
      - "6379:6379"
    networks:
      - keycloak-network

  bff:
    image: bff-service
    build:
      context: ./bff
      dockerfile: Dockerfile.dev
    container_name: bff_service
    ports:
      - "3000:3000"
    volumes:
      - ./bff:/app
      - /app/node_modules
    environment:
      PORT: ${PORT}
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: ${NODE_ENV}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_PUBLIC_ISSUER: ${KEYCLOAK_PUBLIC_ISSUER}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI}
      KEYCLOAK_LOGOUT_REDIRECT_URI: ${KEYCLOAK_LOGOUT_REDIRECT_URI}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      PROTECTED_SERVICE_URL: ${PROTECTED_SERVICE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      TZ: Europe/Moscow
    depends_on:
      - keycloak
      - redis
    networks:
      - keycloak-network

  protected-service:
    build:
      context: ./protected-service
      dockerfile: Dockerfile.dev
    container_name: protected_service
    ports:
      - "8083:8080"
    volumes:
      - ./protected-service:/app
      - /app/node_modules
    environment:
      PORT: 8080
      JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_ISSUER}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      TZ: Europe/Moscow
    depends_on:
      - keycloak
    networks:
      - keycloak-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: react_frontend
    ports:
      - "8082:8082"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - bff
    networks:
      - keycloak-network

networks:
  keycloak-network:
    driver: bridge

volumes:
  postgres_data: