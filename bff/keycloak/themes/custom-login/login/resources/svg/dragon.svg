<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Небо -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="40%" stop-color="#0a0a1a"/>
      <stop offset="70%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>

    <!-- Дальние горы -->
    <linearGradient id="farMountains" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a3a"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>

    <!-- Средние горы -->
    <linearGradient id="midMountains" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151530"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>

    <!-- Ближние горы -->
    <linearGradient id="nearMountains" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d20"/>
      <stop offset="100%" stop-color="#030308"/>
    </linearGradient>

    <!-- Дракон -->
    <linearGradient id="dragonBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2563"/>
      <stop offset="100%" stop-color="#1a0f2e"/>
    </linearGradient>

    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a2d6b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2a1a3e" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff3300" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#cc0000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffff00" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffaa00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fff8e0" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blur1">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <filter id="blur2">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Облако -->
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="80" ry="20" fill="#2a1a4e" opacity="0.5" filter="url(#blur1)"/>
      <ellipse cx="30" cy="-5" rx="50" ry="15" fill="#3a2a5e" opacity="0.4" filter="url(#blur1)"/>
      <ellipse cx="-30" cy="5" rx="60" ry="12" fill="#1a0f3e" opacity="0.5" filter="url(#blur1)"/>
    </g>

    <!-- Птица/летучая мышь -->
    <g id="bird">
      <path d="M-8 0 Q-4 -4 0 -1 Q4 -4 8 0 Q4 -2 0 1 Q-4 -2 -8 0 Z" fill="#0a0510" opacity="0.7"/>
    </g>
  </defs>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- СЛОЙ 0: Небо (статичное)                              -->
  <!-- ══════════════════════════════════════════════════════ -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- СЛОЙ 1: Звёзды (мерцают, чуть-чуть движутся)          -->
  <!-- ══════════════════════════════════════════════════════ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-1600 0" dur="600s" repeatCount="indefinite"/>

    <g opacity="0.7">
      <circle cx="100" cy="80" r="1.5" fill="white"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="120" r="1" fill="white"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="60" r="1.5" fill="white"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="150" r="1" fill="white"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="40" r="1.2" fill="white"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="50" cy="180" r="1" fill="white"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="750" cy="250" r="1.3" fill="white"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="350" cy="200" r="0.8" fill="white"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="100" r="1.2" fill="white"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="1200" cy="180" r="1" fill="white"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="1400" cy="90" r="1.4" fill="white"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="1550" cy="220" r="1" fill="white"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Дубликат для бесшовного цикла -->
    <g opacity="0.7" transform="translate(1600, 0)">
      <circle cx="100" cy="80" r="1.5" fill="white"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="120" r="1" fill="white"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="60" r="1.5" fill="white"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="150" r="1" fill="white"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="1200" cy="180" r="1" fill="white"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="1400" cy="90" r="1.4" fill="white"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.1s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- СЛОЙ 2: Луна (очень медленно плывёт)                  -->
  <!-- ══════════════════════════════════════════════════════ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-1600 0" dur="900s" repeatCount="indefinite"/>
    <g transform="translate(1300, 130)">
      <circle cx="0" cy="0" r="90" fill="url(#moonGlow)"/>
      <circle cx="0" cy="0" r="55" fill="#f0e8d0" opacity="0.85"/>
      <circle cx="15" cy="-5" r="52" fill="#0a0a1a"/>
      <circle cx="1500" cy="0" r="90" fill="url(#moonGlow)"/>
      <circle cx="1500" cy="0" r="55" fill="#f0e8d0" opacity="0.85"/>
      <circle cx="1515" cy="-5" r="52" fill="#0a0a1a"/>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- СЛОЙ 3: Дальние горы (медленный параллакс)            -->
  <!-- ══════════════════════════════════════════════════════ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-1600 0" dur="180s" repeatCount="indefinite"/>
    <g fill="url(#farMountains)" opacity="0.7">
      <path d="M0 620 L80 480 L160 550 L240 450 L340 570 L420 490 L520 590 L600 520 L700 610 L780 530 L880 600 L960 490 L1060 580 L1140 510 L1240 600 L1320 520 L1420 590 L1500 500 L1600 580 L1600 900 L0 900 Z"/>
    </g>
    <g fill="url(#farMountains)" opacity="0.7" transform="translate(1600,0)">
      <path d="M0 620 L80 480 L160 550 L240 450 L340 570 L420 490 L520 590 L600 520 L700 610 L780 530 L880 600 L960 490 L1060 580 L1140 510 L1240 600 L1320 520 L1420 590 L1500 500 L1600 580 L1600 900 L0 900 Z"/>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- СЛОЙ 4: Средние горы (средний параллакс)              -->
  <!-- ══════════════════════════════════════════════════════ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-1600 0" dur="90s" repeatCount="indefinite"/>
    <g fill="url(#midMountains)" opacity="0.9">
      <path d="M0 750 L120 580 L200 660 L320 550 L460 700 L560 600 L680 730 L800 620 L940 720 L1040 620 L1180 740 L1300 630 L1420 720 L1520 620 L1600 700 L1600 900 L0 900 Z"/>
    </g>
    <g fill="url(#midMountains)" opacity="0.9" transform="translate(1600,0)">
      <path d="M0 750 L120 580 L200 660 L320 550 L460 700 L560 600 L680 730 L800 620 L940 720 L1040 620 L1180 740 L1300 630 L1420 720 L1520 620 L1600 700 L1600 900 L0 900 Z"/>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- СЛОЙ 5: Облака (быстрее, пролетают мимо дракона)      -->
  <!-- ══════════════════════════════════════════════════════ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-1600 0" dur="45s" repeatCount="indefinite"/>
    <use href="#cloud" x="200" y="280" opacity="0.7"/>
    <use href="#cloud" x="700" y="380" opacity="0.5"/>
    <use href="#cloud" x="1100" y="220" opacity="0.6"/>
    <use href="#cloud" x="1500" y="450" opacity="0.4"/>
    <use href="#cloud" x="1800" y="300" opacity="0.7"/>
    <use href="#cloud" x="2300" y="400" opacity="0.5"/>
    <use href="#cloud" x="2700" y="250" opacity="0.6"/>
    <use href="#cloud" x="3100" y="420" opacity="0.4"/>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- СЛОЙ 6: Дракон (парит, машет крыльями, дышит огнём)   -->
  <!-- ══════════════════════════════════════════════════════ -->
  <g transform="translate(850, 380)">
    <!-- лёгкое парение -->
    <animateTransform attributeName="transform" type="translate"
      values="850,380;850,360;850,380" dur="4s" repeatCount="indefinite"/>

    <!-- Тело -->
    <ellipse cx="0" cy="0" rx="140" ry="40" fill="url(#dragonBody)" stroke="#6a4a9e" stroke-width="1.5" opacity="0.95"/>

    <!-- Хвост -->
    <path d="M140 0 Q210 -15 260 -40 Q285 -50 275 -25 Q260 -5 235 15 Q195 32 140 18 Z"
          fill="url(#dragonBody)" stroke="#6a4a9e" stroke-width="1" opacity="0.9"/>
    <path d="M260 -40 L285 -65 L275 -45 Z" fill="#4a2d6b" opacity="0.9"/>

    <!-- Шея -->
    <path d="M-140 -5 Q-210 -35 -255 -70 Q-265 -82 -245 -88 Q-215 -95 -195 -70 Q-175 -45 -130 -22 Z"
          fill="url(#dragonBody)" stroke="#6a4a9e" stroke-width="1" opacity="0.95"/>

    <!-- Голова -->
    <g transform="translate(-255, -82)">
      <ellipse cx="0" cy="0" rx="40" ry="25" fill="url(#dragonBody)" stroke="#6a4a9e" stroke-width="1.5"/>
      <path d="M-30 -6 Q-65 -18 -70 -6 Q-68 6 -52 6 Q-35 10 -30 6 Z" fill="url(#dragonBody)" stroke="#6a4a9e" stroke-width="1"/>
      <path d="M-12 -22 L-18 -45 L-6 -35 Z" fill="#4a2d6b" stroke="#8a6abe" stroke-width="1"/>
      <path d="M12 -22 L18 -48 L6 -35 Z" fill="#4a2d6b" stroke="#8a6abe" stroke-width="1"/>
      <circle cx="-18" cy="-9" r="4" fill="url(#eyeGlow)" filter="url(#strongGlow)">
        <animate attributeName="r" values="4;5;4" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-18" cy="-9" r="1.5" fill="#ffff00"/>
      <path d="M-52 2 L-48 10 L-45 2 Z" fill="white" opacity="0.9"/>
      <path d="M-40 3 L-36 11 L-33 3 Z" fill="white" opacity="0.9"/>
    </g>

    <!-- Левое крыло -->
    <g transform="translate(-30, -25)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-18 0 0;-4 0 0;-18 0 0" dur="1.8s" repeatCount="indefinite"/>
        <path d="M0 0 Q-50 -90 -130 -115 Q-105 -75 -55 -50 Q-85 -65 -35 -25 Q-60 -30 0 0 Z"
              fill="url(#wingGrad)" stroke="#6a4a9e" stroke-width="1" opacity="0.85"/>
        <path d="M-55 -50 Q-80 -70 -105 -90" stroke="#8a6abe" stroke-width="0.8" fill="none" opacity="0.6"/>
      </g>
    </g>

    <!-- Правое крыло -->
    <g transform="translate(30, -25)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="18 0 0;4 0 0;18 0 0" dur="1.8s" repeatCount="indefinite"/>
        <path d="M0 0 Q50 -90 130 -115 Q105 -75 55 -50 Q85 -65 35 -25 Q60 -30 0 0 Z"
              fill="url(#wingGrad)" stroke="#6a4a9e" stroke-width="1" opacity="0.85"/>
        <path d="M55 -50 Q80 -70 105 -90" stroke="#8a6abe" stroke-width="0.8" fill="none" opacity="0.6"/>
      </g>
    </g>

    <!-- Огненное дыхание -->
    <g transform="translate(-330, -82)">
      <ellipse cx="0" cy="0" rx="80" ry="25" fill="url(#fireGlow)" filter="url(#strongGlow)" opacity="0.85">
        <animate attributeName="rx" values="70;100;70" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.85;0.4;0.85" dur="1.4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="-40" cy="0" rx="40" ry="12" fill="#ffaa00" filter="url(#glow)" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="0.9s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Чешуйки -->
    <g opacity="0.35">
      <circle cx="-80" cy="-6" r="4" fill="none" stroke="#8a6abe" stroke-width="0.8"/>
      <circle cx="-40" cy="-12" r="4" fill="none" stroke="#8a6abe" stroke-width="0.8"/>
      <circle cx="0" cy="-10" r="4" fill="none" stroke="#8a6abe" stroke-width="0.8"/>
      <circle cx="40" cy="-6" r="4" fill="none" stroke="#8a6abe" stroke-width="0.8"/>
      <circle cx="80" cy="0" r="4" fill="none" stroke="#8a6abe" stroke-width="0.8"/>
    </g>

    <!-- Магическое свечение снизу -->
    <ellipse cx="0" cy="55" rx="180" ry="25" fill="#6a4a9e" opacity="0.15" filter="url(#strongGlow)">
      <animate attributeName="opacity" values="0.15;0.3;0.15" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- СЛОЙ 7: Птицы/летучие мыши (пролетают рядом с драконом)-->
  <!-- ══════════════════════════════════════════════════════ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-1600 0" dur="25s" repeatCount="indefinite"/>
    <use href="#bird" x="400" y="250" opacity="0.7">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -15;0 0" dur="1s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#bird" x="450" y="280" opacity="0.6">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -12;0 0" dur="1.2s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#bird" x="480" y="240" opacity="0.5">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -10;0 0" dur="0.9s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#bird" x="1200" y="180" opacity="0.6">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -15;0 0" dur="1.1s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#bird" x="1250" y="200" opacity="0.5">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -12;0 0" dur="1.3s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#bird" x="2000" y="270" opacity="0.6">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -15;0 0" dur="1s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#bird" x="2050" y="240" opacity="0.5">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -10;0 0" dur="1.2s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- СЛОЙ 8: Ближние горы / тёмный передний план           -->
  <!-- ══════════════════════════════════════════════════════ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-1600 0" dur="50s" repeatCount="indefinite"/>
    <g fill="url(#nearMountains)">
      <path d="M0 900 L100 780 L180 830 L280 760 L380 850 L480 790 L600 870 L700 800 L820 880 L940 810 L1060 890 L1180 820 L1300 890 L1420 830 L1600 900 Z"/>
    </g>
    <g fill="url(#nearMountains)" transform="translate(1600,0)">
      <path d="M0 900 L100 780 L180 830 L280 760 L380 850 L480 790 L600 870 L700 800 L820 880 L940 810 L1060 890 L1180 820 L1300 890 L1420 830 L1600 900 Z"/>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- СЛОЙ 9: Туман (медленно плывёт)                       -->
  <!-- ══════════════════════════════════════════════════════ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-1600 0" dur="120s" repeatCount="indefinite"/>
    <ellipse cx="300" cy="870" rx="400" ry="80" fill="#1a0f2e" opacity="0.5" filter="url(#blur2)"/>
    <ellipse cx="900" cy="880" rx="500" ry="90" fill="#2a1a3e" opacity="0.4" filter="url(#blur2)"/>
    <ellipse cx="1500" cy="870" rx="450" ry="85" fill="#1a0f2e" opacity="0.5" filter="url(#blur2)"/>
    <ellipse cx="2100" cy="880" rx="500" ry="90" fill="#2a1a3e" opacity="0.4" filter="url(#blur2)"/>
    <ellipse cx="2700" cy="870" rx="450" ry="85" fill="#1a0f2e" opacity="0.5" filter="url(#blur2)"/>
  </g>
</svg>
