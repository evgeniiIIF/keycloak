<!DOCTYPE html>
<html>
  <head>
    <title>Silent Check SSO</title>
    <script src="http://localhost:8080/js/keycloak.js"></script>
  </head>
  <body>
    <script>
      const keycloak = new Keycloak({
        url: 'http://localhost:8080',
        realm: 'TestRealm', // This should ideally be dynamic or match the .env
        clientId: 'frontend-client'
      });

      if (keycloak.init({ onLoad: 'check-sso', silentCheckSsoRedirectUri: window.location.origin + '/silent-check-sso.html' }).then(authenticated => {
        window.parent.postMessage(
          JSON.stringify({ "event": "silent-check-sso", "status": authenticated ? "success" : "failure" }),
          "*"
        );
      })) {
        // handled
      }
    </script>
  </body>
</html>
